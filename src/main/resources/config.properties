# ------------------------------------------------------------
# Every value can be overridden from the command line, e.g.
#   mvn test -DdeviceName=Pixel_7 -DappPath=apps/other.apk
# ------------------------------------------------------------

# ---- Where to run ----
# local = emulator / USB phone with a local Appium server
# sauce = real/virtual device on Sauce Labs (needs SAUCE_USERNAME and SAUCE_ACCESS_KEY environment variables)
runOn=local

# ---- Sauce Labs settings (used when runOn=sauce) ----
# Username and access key come from the environment variables SAUCE_USERNAME and SAUCE_ACCESS_KEY.
# sauce.region: us-west-1 (US) or eu-central-1 (Europe) - must match your account's data center
sauce.region=eu-central-1
sauce.appFileName=mda-2.3.0-27.apk
sauce.deviceName=Google Pixel 7 GoogleAPI Emulator
sauce.platformVersion=13.0
sauce.buildName=My Demo App build 1

# ---- Device ----
platformName=Android
automationName=UiAutomator2
deviceName=emulator-5554
# Optional: leave empty to let Appium pick the connected device
platformVersion=
udid=emulator-5554

# ---- Appium server ----
appiumServerUrl=http://127.0.0.1:4723
# true = the framework starts and stops a local Appium server for the run
appium.autoStart=false

# ---- App under test ----
# Put the APK in the apps/ folder and update the file name here
appPath=apps/mda-2.3.0-27.apk
# noReset=true keeps app data between sessions (faster, but tests become dependent)
noReset=false
fullReset=false
newCommandTimeoutSeconds=600

# ---- Slow emulator / computer timeouts (milliseconds) ----
# Appium's default is 20000. Increase these if you see "timed out after 20000ms" errors.
uiautomator2ServerInstallTimeout=120000
uiautomator2ServerLaunchTimeout=120000
adbExecTimeout=120000
androidInstallTimeout=180000

# ---- Demo mode ----
# Pause (milliseconds) after every tap/typing so a screen recording is easy to follow. 0 = off.
demoDelayMs=0

# ---- Waits (seconds) ----
implicitWait=0
explicitWait=40

# ---- Reliability ----
# How many times a failed test is retried before it is reported as failed
retryCount=1
