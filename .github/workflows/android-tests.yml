name: Android UI Tests

# Manual only: the app APK is not stored in the repository, so the workflow needs the APK_URL variable first.
on:
  workflow_dispatch:

jobs:
  smoke-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Appium and the UiAutomator2 driver
        run: |
          npm install -g appium
          appium driver install uiautomator2

      - name: Enable KVM for the Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Define a repository variable APK_URL (Settings > Secrets and variables > Actions > Variables)
      # that points to the APK of the app under test.
      - name: Download the app under test
        run: |
          mkdir -p apps
          curl -fL -o apps/app-under-test.apk "${{ vars.APK_URL }}"

      - name: Run smoke tests on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: |
            nohup appium --log-level error > appium.log 2>&1 &
            sleep 10
            mvn -B clean test -Dsuite.file=testng-smoke.xml -DappPath=apps/app-under-test.apk

      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            target/allure-results
            target/surefire-reports
            target/screenshots
            target/logs
            appium.log
